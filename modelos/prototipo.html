<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBC prototipo</title>

    <link rel="stylesheet" href="css/prototipo.css">
    <link rel="stylesheet" href="icons/fontawesome/css/all.css">
    
</head>
<body>
    
    <!-------------------------------- NASTRO ------------------------------------>
    <section id="nastro-1">
        <div class="div-zero">
            <div class="div-zero-links">
                <ul>
                    <li><a href="">Inicio</a></li>
                    <li><a href="">Tiendas</a></li>
                    <li><a href=""> - Atencion de L - V: 10am a 8pm -</a></li>
                </ul>
            </div>

            <div class="div-zero-promo">
                <ul>
                    <div class="vacio"></div>
                    <li><a href=""><img class="img1" src="../modelos/img/promo/promo-1-corto.png" alt=""></a></li>
                    <li><a href=""><img class="img2" src="../modelos/img/promo/promo-2-corto.png" alt=""></a></li>
                    <div class="vacio"></div>
                </ul>
            </div>

            <div class="div-zero-social">
                <a href=""><i class="fa-brands fa-facebook-f"></i></a>
                <a href=""><i class="fa-brands fa-tiktok"></i></a>
                <a href=""><i class="fa-brands fa-whatsapp"></i></a>
                <a href=""><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </section>

    <!-------------------------------- SEPARATORE ------------------------------------>

    <section id="separator-2a">
        <div class="separator-2a-neon-plus"></div>
    </section>

    <!----------------------- LOGO, MOTORE DI RICERCA E PULSANTI ------------------->
    <section id="header-1">
        
        <div class="div-0">

            <!------------------------ FIRST MEDIA QUERY 480PX -------------------->
            <div class="div-2-first">
                <a class="div-2-menu-first" href="">
                    <div class="div-2-i-first">
                        <i class="fa-solid fa-bars"></i>
                    </div>
                </a>
            </div>
            <!--------------------------------------------------------------------->

            <div class="div-1">
                <a href=""><img src="img/img-dino-sbc.png" alt="dino"></a>
            </div>
            
            <div class="div-2">
                <a class="div-2-menu" href="">
                    <div class="div-2-i">
                        <i class="fa-solid fa-bars"></i>
                    </div>
                    <div class="div-2-p">
                        <p>Menu de Categorias</p>
                    </div>
                </a>
            </div>

            <div class="div-3">
                <form method="get" class="" action="http://www.google.com/search" target="_blank">

                    <div class="div-3-search">
                        <div class="div-3-search-square">
                            <input type="text" name="q" id="buscar" size="30" class="form-control" maxlength="255" value="" placeholder="Busca tus productos en SUBACOM">
                            <input type="hidden" name="hl" value="es">
                        </div>

                        <div class="div-3-search-button">
                            <input type="submit" class="btn btn-default" name="btnG" value="Buscar">
                        </div>
                    </div>

                </form>
            </div>

            <div class="div-4">
                
                <a class="div-4-user" href="">
                    <div class="div-4-user-i-1">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="div-4-user-p">
                        <p>Iniciar sesión</p>
                    </div>

                    <div class="div-4-user-i-2">
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </a>

                <a class="div-4-pc" href="">
                    <div class="div-4-pc-i">
                        <i class="fa-solid fa-desktop"></i>
                    </div>
                    <div class="div-4-pc-p">
                        <p>Arma tu PC</p>
                    </div>
                </a>

                <a class="div-4-cart" href="">
                    <div class="div-4-cart-i">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </div>
                </a>
            </div>

        </div>

        <div class="div-3-sub">
                <form method="get" class="" action="http://www.google.com/search" target="_blank">
                    <div class="div-3-search-sub">
                        <div class="div-3-search-square-sub">
                            <input type="text" name="q" id="buscar" size="30" class="form-control-sub" maxlength="255" value="" placeholder="Busca tus productos en SUBACOM">
                            <input type="hidden" name="hl" value="es">
                        </div>

                        <div class="div-3-search-button-sub">
                            <input type="submit" class="btn btn-default" name="btnG" value="Buscar">
                        </div>
                    </div>

                </form>
        </div>

    </section>

    <!-------------------------------- SEPARATORE ------------------------------------>

    <section id="separator-2a">
        <div class="separator-2a-neon-plus"></div>
    </section>
</body>
</html>
