<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrouseles</title>

    <link rel="stylesheet" href="css/carrousel.css">
    <link rel="stylesheet" href="resources/splide-4.1.3/dist/css/splide.css">
    <script src="resources/splide-4.1.3/dist/js/splide.js"></script>

</head>
<body>

    <!---------------------------------------------------- CARROUSEL 1 ----------------------------------------------------->
    <section id="slider-1">

        <div class="slider-container">
            <div class="slider">
                <!-- Las imagenes las envolvemos con div porque le daremos estilos
                sin modificar tanto la imagen, segun el tutorial -->
                <div class="slide"><img src="img/carrousel/esempio/img-1.jpg" alt=""></div>
                <div class="slide"><img src="img/carrousel/esempio/img-2.jpg" alt=""></div>
                <div class="slide"><img src="img/carrousel/esempio/img-3.jpg" alt=""></div>
                <div class="slide"><img src="img/carrousel/esempio/img-4.jpg" alt=""></div>
                <div class="slide"><img src="img/carrousel/esempio/img-5.jpg" alt=""></div>
            </div>

            <div class="button">
                <button onclick="prevSlide()">&#10094</button><!-- 4- con este codigo se crean la sflechas angulares -->
                <button onclick="nextSlide()">&#10095</button> <!-- 12- el boton derecho e izquierda funcionan -->
            </div>

            <div class="dots-container"></div>

        </div>

    </section>

    <!---------------------------------------------------- CARROUSEL 2 ----------------------------------------------------->

    <!-- AQUI USAMOS CODIGO DE SPLIDEJS.COM -->
    <section class="splide" aria-label="Ejemplo de estructura básica">
        <!-- <div class="splide__arrows"> // PARA TENER LETRAS DENTRO DE LAS FLECHAS
            <button class="splide__arrow splide__arrow--prev">
                Prev
            </button>
            <button class="splide__arrow splide__arrow--next">
                Next
            </button>
        </div> -->

        <div class="splide__track">
            <ul class="splide__list">
                <li class="splide__slide"><img src="img/banners/banner1.jpg" alt=""></li>
                <li class="splide__slide"><img src="img/banners/banner2.jpg" alt=""></li>
                <li class="splide__slide"><img src="img/banners/banner3.jpg" alt=""></li>
            </ul>
        </div>
    </sección>

    <script>
        var splide = new Splide( '.splide',{type: 'loop', autoplay: true, interval: '5000'} ); /* {type: 'loop'} para que comience desde la primera al llegar al ultimo*/
        splide.mount();


    </script>

    <!---------------------------------------------------- Scripts ----------------------------------------------------->


    <script src="js/carrousel.js"></script>

</body>
</html>
