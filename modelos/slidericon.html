<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Slider icons</title>
</head>
<body>
    

    <title>Slide icon</title>

    <link rel="stylesheet" href="css/slidericon.css">

    <link rel="stylesheet" href="resources/splide-4.1.3/dist/css/splide.min.css">
    <script src="resources/splide-4.1.3/dist/js/splide.min.js"></script>

</head>
<body>
    
    <section class="splide" aria-labelledby="carousel-heading">
        <h2 id="carousel-heading">Más categorias</h2>

        <div class="splide__track">
            <ul class="splide__list">
                <li class="splide__slide">
                    <a href=""><img src="img/slider/slidericon-1/almacenamiento.png" alt="">
                    <p>Almacenamiento</p></a>
                </li>
                <li class="splide__slide">
                    <a href=""><img src="img/slider/slidericon-1/acc-tecnologicos.png" alt="">
                    <p>Accesorios tecnologicos</p></a>
                </li>
                <li class="splide__slide">
                    <a href=""><img src="img/slider/slidericon-1/acc-laptops.png" alt="">
                    <p>Accesorios para laptops</p></a>
                </li>
                <li class="splide__slide">
                    <a href=""><img src="img/slider/slidericon-1/acc-general.png" alt="">
                    <p>Accesorios en general</p></a>
                </li>
                <li class="splide__slide">
                    <a href=""><img src="img/slider/slidericon-1/software.png" alt="">
                    <p>Software</p></a>
                </li>
            </ul>

        </div>
    </section>

    <script>
        var splide = new Splide( '.splide', {
        type   : 'loop',
        drag   : 'free',
        perPage: 5,
        } );

        splide.mount();
    </script>
</body>
</html>
