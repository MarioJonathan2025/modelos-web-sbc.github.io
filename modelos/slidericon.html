<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider icons</title>

    <link rel="stylesheet" href="css/slidericon.css">
    <link rel="stylesheet" href="resources/splide-4.1.3/dist/css/animate.css">

    <link rel="stylesheet" href="resources/splide-4.1.3/dist/css/splide.css"> 
    <script src="resources/splide-4.1.3/dist/js/splide.min.js"></script>
</head>

<body>
    
    <section class="splide" aria-labelledby="carousel-heading">
        <h2 id="carousel-heading">Más categorias</h2>

        <div class="splide__track">
            <ul class="splide__list">
                <li class="splide__slide">
                    <a href="" class="circulo"><img src="img/slider/slidericon-1/almacenamiento.png" alt="">
                    </a><p>Almacenamiento</p>
                </li>
                <li class="splide__slide">
                    <a href="" class="circulo"><img src="img/slider/slidericon-1/acc-tecnologicos.png" alt="">
                    </a><p>Dispositivos tecnologicos</p>
                </li>
                <li class="splide__slide">
                    <a href="" class="circulo"><img src="img/slider/slidericon-1/acc-laptops.png" alt="">
                    </a><p>Accesorios para laptops</p>
                </li>
                <li class="splide__slide">
                    <a href="" class="circulo"><img src="img/slider/slidericon-1/acc-general.png" alt="">
                    </a><p>Accesorios en general</p>
                </li>
                <li class="splide__slide">
                    <a href="" class="circulo"><img src="img/slider/slidericon-1/software.png" alt="">
                    </a><p>Software</p>
                </li>
                <li class="splide__slide">
                    <a href="" class="circulo"><img src="img/slider/slidericon-1/limpieza-mantenimiento.png" alt="">
                    </a><p>Limpieza y Mantenimiento</p>
                </li>
            </ul>
        </div>

    </section>

    <script>
        var splide2 = new Splide( '.splide', {
        type   : 'loop',
        drag   : 'free',
        perPage: 6.01,
        } );

        splide2.mount();
    </script>

</body>
</html>
